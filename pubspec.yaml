# pubspec.yaml is the manifest of a Dart/Flutter package. It plays a role
# similar to CMakeLists.txt plus a dependency manifest in a C++ project.
name: morpheus
description: A privacy-first dream journal practice project.

# This application is not intended to be published as a reusable package on
# pub.dev, so accidental publication is disabled.
publish_to: none

# The part before `+` is the user-visible version. The number after `+` is the
# internal build number used by app stores.
version: 0.1.0+1

environment:
  # Riverpod 3.4 and go_router 18 require Dart 3.12 or newer. Keeping the upper
  # bound below Dart 4 prevents an unreviewed major-language upgrade.
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Flutter SDK 自带的本地化支持，让系统日期选择器显示中文年月、星期和按钮。
  # 它提供标准组件的翻译；梦境正文仍是用户自己的文字，不需要翻译处理。
  flutter_localizations:
    sdk: flutter

  # gen-l10n 生成代码使用 intl；沿用已有锁定版本，不升级其他依赖。
  intl: ^0.20.3

  # Riverpod stores application state outside widgets. This separation makes
  # business logic testable without pressing buttons on a real device.
  flutter_riverpod: ^3.4.3

  # go_router keeps navigation rules in one place. The skeleton has one route,
  # but later milestones can add calendar and settings pages cleanly.
  go_router: ^18.0.1

  # Drift 用 Dart 对象表达 SQL 查询，SQLite 则真正把记录写入磁盘文件。
  # drift_flutter 负责原生平台的连接、后台数据库线程和必要的平台适配。
  drift: ^2.35.3
  drift_flutter: ^0.3.1

  # 获取 App 的私有应用支持目录；不能把数据库放进可能被清理的临时目录。
  path_provider: ^2.1.6

  # 调用 Android / iOS 的本地通知；22.3 系列兼容现有 SDK 36 工程，
  # 同时包含 iOS 27 权限处理与夏令时修复，无需为本功能升级 Android SDK。
  flutter_local_notifications: ^22.3.3

  # 获取设备真正的 IANA 时区，并按当地的“每天几点”计算下一次提醒。
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  # 官方系统相册选择器；图片选取后复制到私有目录，不依赖相册临时路径。
  image_picker: ^1.2.4
  # 官方系统内嵌浏览器与外部音乐App链接接口。
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended analyzer rules for Flutter projects.
  flutter_lints: ^6.0.0

  # 这两个包只在开发时运行：根据表定义生成类型安全的数据库代码。
  # 修改表后运行 dart run build_runner build；不要手改生成的 .g.dart 文件。
  drift_dev: ^2.35.2
  build_runner: ^2.16.2

  # 仅用于测试：给默认数据库连接注入临时应用目录，不访问用户真实沙盒。
  # 平台接口包允许模拟系统路径，SQL 与后台数据库连接本身仍然真实执行。
  path_provider_platform_interface: ^2.1.3

flutter:
  # 从 lib/l10n/*.arb 自动生成类型安全的文案访问代码。
  generate: true
  # Enables the built-in Material icon font.
  uses-material-design: true
